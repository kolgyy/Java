spring.application.name=ApiGateway

server.port=8082

# URL for registering microservices
eureka.client.service-url.defaultZone=http://localhost:8081/eureka

# Logging format
logging.pattern.console=%C{1.} [%-5level] %d{HH:mm:ss} - %msg%n

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Changing routes
spring.cloud.gateway.server.webflux.routes[0].id=test
spring.cloud.gateway.server.webflux.routes[0].uri=lb://eurekaclient
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/main/test
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[1].id=name
spring.cloud.gateway.server.webflux.routes[1].uri=lb://eurekaclienttwo
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/new/name
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=GET