server:
  port: 8081

spring:
  main:
    allow-bean-definition-overriding: true

app:
  communication:
    client: http
    server: http

  scheduler:
    delay: 5s

  github:
    base-url: http://github-api:8080

  stackoverflow:
    base-url: http://stackoverflow-api:8080

bot:
  http:
    base-url: http://bot:8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    org.springframework: WARN
    backend.academy: DEBUG
