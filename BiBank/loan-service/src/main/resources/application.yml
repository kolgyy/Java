server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  autoconfigure:
    # Пользователи приходят из JWT, встроенный in-memory пользователь не нужен
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: loan-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${LOAN_DB_NAME:bibank_loans}
    username: ${LOAN_DB_USER:bibank_loans}
    password: ${LOAN_DB_PASSWORD:bibank_loans}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: 'loan:'
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

bibank:
  security:
    jwt-secret: ${JWT_SECRET}
    internal-token: ${INTERNAL_API_TOKEN}
  outbox:
    enabled: true
  loan:
    account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
