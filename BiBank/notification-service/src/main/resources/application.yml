server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  autoconfigure:
    # Пользователи приходят из JWT, встроенный in-memory пользователь не нужен
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${NOTIFICATION_DB_NAME:bibank_notifications}
    username: ${NOTIFICATION_DB_USER:bibank_notifications}
    password: ${NOTIFICATION_DB_PASSWORD:bibank_notifications}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
    producer:
      acks: all

bibank:
  security:
    jwt-secret: ${JWT_SECRET}
    internal-token: ${INTERNAL_API_TOKEN}
  outbox:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
