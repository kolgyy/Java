server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s

bibank:
  gateway:
    jwt-secret: ${JWT_SECRET}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
    services:
      auth: ${AUTH_SERVICE_URL:http://localhost:8081}
      account: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
      payment: ${PAYMENT_SERVICE_URL:http://localhost:8083}
      loan: ${LOAN_SERVICE_URL:http://localhost:8084}
      notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /gateway/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api-docs/auth
      - name: Account Service
        url: /api-docs/account
      - name: Payment Service
        url: /api-docs/payment
      - name: Loan Service
        url: /api-docs/loan
      - name: Notification Service
        url: /api-docs/notification
