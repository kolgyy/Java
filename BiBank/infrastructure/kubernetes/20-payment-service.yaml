# payment-service: 2 реплики: конкурентные переводы защищены блокировками в БД, outbox — SKIP LOCKED
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: bibank
  labels: { app.kubernetes.io/name: payment-service, app.kubernetes.io/part-of: bibank }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: payment-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payment-service, app.kubernetes.io/part-of: bibank }
    spec:
      containers:
        - name: payment-service
          image: bibank/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8083 }
          envFrom:
            - configMapRef: { name: bibank-config }
          env:
            - { name: SERVER_PORT, value: "8083" }
            - name: PAYMENT_DB_USER
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: PAYMENT_DB_USER } }
            - name: PAYMENT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: PAYMENT_DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_TOKEN
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: INTERNAL_API_TOKEN } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 640Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: bibank
spec:
  selector: { app.kubernetes.io/name: payment-service }
  ports:
    - { name: http, port: 8083, targetPort: http }
