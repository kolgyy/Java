# loan-service: одна реплика достаточна для учебного стенда
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: bibank
  labels: { app.kubernetes.io/name: loan-service, app.kubernetes.io/part-of: bibank }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loan-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loan-service, app.kubernetes.io/part-of: bibank }
    spec:
      containers:
        - name: loan-service
          image: bibank/loan-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8084 }
          envFrom:
            - configMapRef: { name: bibank-config }
          env:
            - { name: SERVER_PORT, value: "8084" }
            - name: LOAN_DB_USER
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: LOAN_DB_USER } }
            - name: LOAN_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: LOAN_DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_TOKEN
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: INTERNAL_API_TOKEN } }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 640Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: bibank
spec:
  selector: { app.kubernetes.io/name: loan-service }
  ports:
    - { name: http, port: 8084, targetPort: http }
