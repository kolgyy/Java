apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bibank
  labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: bibank }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: bibank }
    spec:
      containers:
        - name: api-gateway
          image: bibank/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: REDIS_HOST, value: redis }
            - { name: CORS_ALLOWED_ORIGINS, value: "http://bibank.local" }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:8081" }
            - { name: ACCOUNT_SERVICE_URL, value: "http://account-service:8082" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:8083" }
            - { name: LOAN_SERVICE_URL, value: "http://loan-service:8084" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8085" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bibank-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bibank
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
