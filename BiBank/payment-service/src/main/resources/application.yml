server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  autoconfigure:
    # Пользователи приходят из JWT, встроенный in-memory пользователь не нужен
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB_NAME:bibank_payments}
    username: ${PAYMENT_DB_USER:bibank_payments}
    password: ${PAYMENT_DB_PASSWORD:bibank_payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: 'payment:'
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

bibank:
  security:
    jwt-secret: ${JWT_SECRET}
    internal-token: ${INTERNAL_API_TOKEN}
  outbox:
    enabled: true
  payment:
    account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    max-transfer-amount: 10000000
    max-top-up-amount: 1000000
    retry-delay: 5s
    max-attempts: 20
    rates-to-rub:
      USD: 92.50
      EUR: 100.20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
